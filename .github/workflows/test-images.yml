name: Platform Image Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - stable**
  workflow_dispatch:
    inputs:
      last_release:
        description: "Test backwards compatibility with platform ver [semvar]"
        required: false
      models_branch:
        description: "OasisModels branch to test with (default: main, or the matching stable/* branch) [git ref]"
        required: false
      pytest_options:
        description: "Extra pytest args for the OasisModels platform tests [-k <test_name>]"
        required: false
      compat_pytest_options:
        description: "Extra pytest args for the compatibility checks (OasisModels platform tests) [-k <test_name>]"
        required: false
      cve_severity:
        description: 'Severities of vulnerabilities to scanned for [LOW, MEDIUM, HIGH, CRITICAL, SKIP]'
        required: false
      oasislmf_branch:
        description: 'If set, pip install oasislmf branch [git ref]'
        required: false
      ods_branch:
        description: 'If set, pip install ods-tools branch [git ref]'
        required: false

env:
  pre_release: 'true'  # look for pre-release when testing last released platform version
  semver_major: '2'    # Search for published images but limited to {semvar_major}.x.x
  #semver_minor: '27'   # Search for published images but limited to x.{semvar_minor}.x

jobs:
  build_images:
    uses: ./.github/workflows/build-images.yml
    secrets: inherit
    with:
      docker_push: true
      ignore_unfixed: true
      cve_severity: ${{ github.event_name != 'workflow_dispatch' && 'CRITICAL,HIGH' ||  inputs.cve_severity }}
      #cve_severity: ${{ github.event_name != 'workflow_dispatch' && 'SKIP' ||  inputs.cve_severity }}
      oasislmf_branch: ${{ github.event_name != 'workflow_dispatch' && 'main' || inputs.oasislmf_branch }}
      ods_branch: ${{ github.event_name != 'workflow_dispatch' && 'main' || inputs.ods_branch }}

  test-jit-cache:
    runs-on: ubuntu-latest
    needs: [build_images]
    steps:
      - uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull model_worker image
        run: |
          IMAGE_TAG=$(git rev-parse HEAD)
          docker pull coreoasis/github-actions:model_worker-${IMAGE_TAG}
          echo "IMAGE=coreoasis/github-actions:model_worker-${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Test Numba JIT cache validity
        run: ./scripts/test-jit-cache.sh ${{ env.IMAGE }}

  setup:
    runs-on: ubuntu-latest
    needs: [build_images]
    outputs:
      models_branch: ${{ steps.models.outputs.branch }}

      release_tag: ${{ steps.released_images.outputs.prev_release_tag }}

      build_server_img: ${{ steps.built_images.outputs.server_img }}
      build_server_tag: ${{ steps.built_images.outputs.server_tag }}
      build_worker_img: ${{ steps.built_images.outputs.worker_img }}
      build_worker_tag: ${{ steps.built_images.outputs.worker_tag }}

    steps:
      - name: Checkout Platform
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Load latest release tag
        id: released_images
        run: |
          # Find the latest release tag only from current branch
          if [[ "${{ github.ref_name }}" == backports/ ]]; then
            tag=$( ./scripts/find_release.sh -p "${{ env.pre_release }}")
            echo "prev_release_tag=$tag" >> $GITHUB_OUTPUT
          # Find tags release accross all branches, limited to matching semver
          elif [[ -z "${{ inputs.last_release }}" ]]; then
            tag=$( ./scripts/find_latest.sh -j "${{ env.semver_major }}" -i "${{ env.semver_minor }}" )
            echo "prev_release_tag=$tag" >> $GITHUB_OUTPUT
          # Don't search, use the given input
          else
            echo "prev_release_tag=${{ inputs.last_release }}" >> $GITHUB_OUTPUT
          fi

      - name: Select OasisModels branch
        id: models
        run: |
          # Expected results come from OasisModels main, or the stable/* branch matching the PR base / pushed branch
          if [[ "${{ github.event_name }}" = "pull_request" ]]; then
            BRANCH=${{ github.base_ref }}
          else
            BRANCH=${{ github.ref_name }}
          fi
          if [[ ! $BRANCH == stable/* ]]; then
            BRANCH='feature/platform-tests'  # TODO: 'main' once OasisModels#65 is merged
          fi
          if [[ -n "${{ inputs.models_branch }}" ]]; then
            BRANCH="${{ inputs.models_branch }}"
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      # Split ouput strings from build job
      - name: Load built images
        id: built_images
        run: |
          server_img=$(echo ${{ needs.build_images.outputs.server_image }} | awk '{split($0,a,":"); print a[1];}')
          server_tag=$(echo ${{ needs.build_images.outputs.server_image }} | awk '{split($0,a,":"); print a[2];}')
          echo "server_img=$server_img" >> $GITHUB_OUTPUT
          echo "server_tag=$server_tag" >> $GITHUB_OUTPUT

          worker_img=$(echo ${{ needs.build_images.outputs.worker_image }} | awk '{split($0,a,":"); print a[1];}')
          worker_tag=$(echo ${{ needs.build_images.outputs.worker_image }} | awk '{split($0,a,":"); print a[2];}')
          echo "worker_img=$worker_img" >> $GITHUB_OUTPUT
          echo "worker_tag=$worker_tag" >> $GITHUB_OUTPUT

  # Every enabled OasisModels test case, on the newly built images
  all_checks_v1:
    name: All checks
    secrets: inherit
    needs: [setup]
    uses: OasisLMF/OasisModels/.github/workflows/platform-tests.yml@feature/platform-tests  # TODO: @main once OasisModels#65 is merged
    with:
      models_branch: ${{ needs.setup.outputs.models_branch }}
      oasislmf_branch: ${{ github.event_name != 'workflow_dispatch' && 'main' || inputs.oasislmf_branch }}
      server_image: ${{ needs.setup.outputs.build_server_img }}
      server_tag: ${{ needs.setup.outputs.build_server_tag }}
      worker_image: ${{ needs.setup.outputs.build_worker_img }}
      worker_tag: ${{ needs.setup.outputs.build_worker_tag }}
      worker_api_ver: 'v1'
      debug_mode: '1'
      pytest_opts: ${{ inputs.pytest_options }}
      storage_suffix: '-all-checks-v1'

  all_checks_v2:
    name: All checks
    secrets: inherit
    needs: [setup]
    uses: OasisLMF/OasisModels/.github/workflows/platform-tests.yml@feature/platform-tests  # TODO: @main once OasisModels#65 is merged
    with:
      models_branch: ${{ needs.setup.outputs.models_branch }}
      oasislmf_branch: ${{ github.event_name != 'workflow_dispatch' && 'main' || inputs.oasislmf_branch }}
      server_image: ${{ needs.setup.outputs.build_server_img }}
      server_tag: ${{ needs.setup.outputs.build_server_tag }}
      worker_image: ${{ needs.setup.outputs.build_worker_img }}
      worker_tag: ${{ needs.setup.outputs.build_worker_tag }}
      worker_api_ver: 'v2'
      debug_mode: '1'
      pytest_opts: ${{ inputs.pytest_options }}
      storage_suffix: '-all-checks-v2'

  # Everything else runs the base case only (PiWind/test_1)
  # The non-default backends: S3 storage and MySQL databases
  storage_s3_v1:
    name: S3 + MySQL
    secrets: inherit
    needs: [setup]
    uses: OasisLMF/OasisModels/.github/workflows/platform-tests.yml@feature/platform-tests  # TODO: @main once OasisModels#65 is merged
    with:
      models_branch: ${{ needs.setup.outputs.models_branch }}
      oasislmf_branch: ${{ github.event_name != 'workflow_dispatch' && 'main' || inputs.oasislmf_branch }}
      server_image: ${{ needs.setup.outputs.build_server_img }}
      server_tag: ${{ needs.setup.outputs.build_server_tag }}
      worker_image: ${{ needs.setup.outputs.build_worker_img }}
      worker_tag: ${{ needs.setup.outputs.build_worker_tag }}
      worker_api_ver: 'v1'
      platform_tests: 'PiWind/test_1'
      storage: 's3'
      db: 'mysql'
      debug_mode: '1'
      pytest_opts: ${{ inputs.pytest_options }}
      storage_suffix: '_s3-mysql-v1'

  storage_s3_v2:
    name: S3 + MySQL
    secrets: inherit
    needs: [setup]
    uses: OasisLMF/OasisModels/.github/workflows/platform-tests.yml@feature/platform-tests  # TODO: @main once OasisModels#65 is merged
    with:
      models_branch: ${{ needs.setup.outputs.models_branch }}
      oasislmf_branch: ${{ github.event_name != 'workflow_dispatch' && 'main' || inputs.oasislmf_branch }}
      server_image: ${{ needs.setup.outputs.build_server_img }}
      server_tag: ${{ needs.setup.outputs.build_server_tag }}
      worker_image: ${{ needs.setup.outputs.build_worker_img }}
      worker_tag: ${{ needs.setup.outputs.build_worker_tag }}
      worker_api_ver: 'v2'
      platform_tests: 'PiWind/test_1'
      storage: 's3'
      db: 'mysql'
      debug_mode: '1'
      pytest_opts: ${{ inputs.pytest_options }}
      storage_suffix: '_s3-mysql-v2'

  # Released platform versions against the new images (OasisModels, runs must complete), see test-compatibility.yml
  compatibility:
    name: Compatibility
    secrets: inherit
    needs: [setup]
    uses: ./.github/workflows/test-compatibility.yml
    with:
      server_image: ${{ needs.setup.outputs.build_server_img }}
      server_tag: ${{ needs.setup.outputs.build_server_tag }}
      worker_image: ${{ needs.setup.outputs.build_worker_img }}
      worker_tag: ${{ needs.setup.outputs.build_worker_tag }}
      models_branch: ${{ needs.setup.outputs.models_branch }}
      oasislmf_branch: ${{ github.event_name != 'workflow_dispatch' && 'main' || inputs.oasislmf_branch }}
      pytest_options: ${{ inputs.compat_pytest_options }}
